# Nginx: único contenedor expuesto (RNF-02). Sirve la SPA y reenvía /api/ a la API (puerto 8000, solo en la red de Docker).
# Certificado: nginx/certs/fullchain.pem y privkey.pem (fuera del repositorio; ver scripts/certificado_local.sh).
server_tokens off;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;
limit_req_status 429;
log_format sidpol '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent ${request_time}s rid=$request_id';
access_log /dev/stdout sidpol;
error_log /dev/stderr warn;

server {
    listen 80;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;               # TLS >= 1.2
    ssl_session_cache shared:ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Errores de Nginx con el mismo formato y lenguaje que los de la API
    error_page 413 = @e413;
    error_page 429 = @e429;
    error_page 502 503 504 = @e50x;
    location @e413 { default_type application/json; return 413 '{"codigo":"ARCHIVO_MUY_GRANDE","mensaje":"El archivo es demasiado grande.","detalle":{}}'; }
    location @e429 { default_type application/json; return 429 '{"codigo":"DEMASIADAS_PETICIONES","mensaje":"Demasiados intentos seguidos. Espera un momento e inténtalo de nuevo.","detalle":{}}'; }
    location @e50x { default_type application/json; return 502 '{"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"El servicio no está disponible ahora. Vuelve a intentarlo en un momento.","detalle":{}}'; }

    # Estado del propio Nginx (para el monitoreo); no toca la API.
    location = /salud { default_type text/plain; return 200 "ok\n"; }

    # La documentación interactiva no se publica.
    location ~ ^/api/(docs|redoc|openapi\.json) { return 404; }

    # Inicio de sesión: además del límite de la API, 10 intentos por minuto por IP.
    location = /api/auth/login {
        limit_req zone=acceso burst=5 nodelay;
        client_max_body_size 4k;
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://api:8000/auth/login;
    }

    # Registro de versiones: el CSV nacional pesa ~27 MB (tope de la API: 40 MB).
    location = /api/versiones {
        limit_req zone=general burst=60 nodelay;
        client_max_body_size 45m;
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://api:8000/versiones$is_args$args;
    }

    location /api/ {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://api:8000/;
    }

    # La SPA: los archivos con huella en el nombre se guardan un año; index.html nunca.
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires epoch; try_files $uri $uri/ /index.html; }
}
