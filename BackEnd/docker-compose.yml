name: sidpolapp  # de aquí salen los nombres de los volúmenes
# Una sola VM. Solo `nginx` publica puertos (80 → redirige a 443). La base y los tres servicios FastAPI quedan en la red interna.
# Desarrollo: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build   (publica la API en 8000 y /docs)
x-seguro: &seguro
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    <<: *seguro
    image: postgres:16
    cap_drop: []  # el arranque de la imagen oficial cambia de usuario y necesita sus capacidades; no se publica ningún puerto
    environment:
      POSTGRES_USER: sidpol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: sidpol
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidpol"]
      interval: 5s
      retries: 10

  migrar:
    build: { context: ., args: { SERVICIO: api_plataforma } }
    command: alembic upgrade head
    env_file: .env
    environment: &entorno
      DATABASE_URL: postgresql+psycopg://sidpol:${POSTGRES_PASSWORD}@db:5432/sidpol
    depends_on: { db: { condition: service_healthy } }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  api:
    <<: *seguro
    build: { context: ., args: { SERVICIO: api_plataforma } }
    env_file: .env
    environment: { <<: *entorno, FORWARDED_ALLOW_IPS: "*" }  # la IP real llega en X-Forwarded-For; solo Nginx alcanza este puerto
    expose: ["8000"]
    volumes: [csv:/datos/csv]
    healthcheck: &salud
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ.get(\"PUERTO\", \"8000\")}/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on: { migrar: { condition: service_completed_successfully } }

  # Interno: sin puerto publicado (solo `expose`); la API lo llama con x-clave-servicio.
  ingesta:
    <<: *seguro
    build: { context: ., args: { SERVICIO: servicio_ingesta } }
    env_file: .env
    environment: { <<: *entorno, PUERTO: "8001" }
    expose: ["8001"]
    volumes: [csv:/datos/csv:ro]
    healthcheck: *salud
    depends_on: { migrar: { condition: service_completed_successfully } }

  # Interno: sin puerto publicado; recupera como «fallida» toda ejecución que haya quedado en curso al reiniciar.
  modelado:
    <<: *seguro
    build: { context: ., args: { SERVICIO: servicio_modelado, PYTHON: "3.13", REQUISITOS: requirements-modelado.txt } }
    env_file: .env
    environment: { <<: *entorno, PUERTO: "8002" }
    expose: ["8002"]
    healthcheck: *salud
    depends_on: { migrar: { condition: service_completed_successfully } }

  # Único servicio expuesto. Certificado en nginx/certs/ (fuera del repositorio); la SPA compilada va en FRONT_DIST.
  nginx:
    <<: *seguro
    image: nginx:1.27-alpine
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ${FRONT_DIST:-./nginx/html}:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "--no-check-certificate", "https://127.0.0.1/salud"]
      interval: 15s
      retries: 5
    depends_on:
      api: { condition: service_healthy }

  # Respaldo diario de la base y de los CSV originales (se conservan 14 días). Ver respaldo/restaurar.sh.
  respaldo:
    <<: *seguro
    image: postgres:16
    cap_drop: []
    entrypoint: ["/bin/sh", "/respaldo/respaldar.sh"]
    environment:
      PGHOST: db
      PGUSER: sidpol
      PGDATABASE: sidpol
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENER_DIAS: "14"
    volumes:
      - ./respaldo:/respaldo:ro
      - respaldos:/respaldos
      - csv:/datos/csv:ro
    depends_on: { migrar: { condition: service_completed_successfully } }

volumes:
  pgdata:
  csv:
  respaldos:
